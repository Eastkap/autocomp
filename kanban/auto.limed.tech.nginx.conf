# nginx vhost for the autocomp kanban. Cloudflare proxies auto.limed.tech and
# terminates TLS (set CF SSL mode to "Flexible"), so origin serves plain HTTP :80.
# Install: see kanban/SETUP.md step 4.
server {
    listen 80;
    listen [::]:80;
    server_name auto.limed.tech;

    root /var/www/auto.limed.tech;
    index index.html;

    # static files only; no directory listing
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # don't cache the app shell so config/app changes show up immediately
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }
}
