# trawl-worker — run this on a RESIDENTIAL-IP homelab box.
# Brings up: TRAWL (real Camoufox Firefox solver) + Redis (session cache) + our
# pull-worker that drains solve_jobs from Supabase. Outbound-only; no ports need
# to be exposed to the internet (8191 is published to LOCALHOST for debugging only).
#
#   cp .env.example .env    # fill in the 3 values
#   docker compose up -d
#   docker compose logs -f worker
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  trawl:
    image: ghcr.io/germondai/trawl:latest
    restart: unless-stopped
    shm_size: 1gb
    environment:
      REDIS_URL: redis://redis:6379
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-2}
    ports:
      - "127.0.0.1:8191:8191"   # localhost-only; the worker reaches it over the compose network
    depends_on:
      - redis

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      TRAWL_URL: http://trawl:8191
      WORKER_ID: ${WORKER_ID:-homelab}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
    depends_on:
      - trawl

volumes:
  redis_data:
